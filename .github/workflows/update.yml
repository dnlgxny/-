name: 每日更新数据并部署

# ═══════════════════════════════════════════════════════════════
# 用途：每个工作日自动拉取最新数据 → 重新生成页面 → 部署到 GitHub Pages
# 特点：跑在 GitHub 云端，**不依赖本机开机**
#
# ⚠️ 前置条件（在仓库 Settings 里设置）
#   Settings → Pages → Source 选「GitHub Actions」
#
# ⚠️ FRED 封锁说明
#   本机的 fred.stlouisfed.org 被封，但 GitHub 云端**通常不受影响**；
#   脚本逻辑是「本地缓存优先 + 替代源拼接」，云端会自动补齐并提交缓存更新。
# ═══════════════════════════════════════════════════════════════

on:
  push:
    branches: [main]        # 推送即触发（便于验证；数据提交也会触发一次）
  schedule:
    # ⚠️ GitHub 的 schedule **不保证准时**（官方：高峰期可能延迟 1 小时以上）。
    # 因此设多个时间点，任一次触发成功即可；配合后面的「数据未变则跳过」保证幂等。
    # UTC 时间 → 北京时间 +8
    - cron: '30 1 * * 1-5'    # 北京 09:30（主）
    - cron: '30 3 * * 1-5'    # 北京 11:30（补跑）
    - cron: '30 6 * * 1-5'    # 北京 14:30（再补）
    # ⚠️ 2026-11-07 新增：美股收盘后补最新一根
    #   美股 16:00 ET = 21:00 UTC = 北京次日 05:00；周二~周六的 05:30 跑，
    #   正好把那根「美股收盘 K 线」抓进来。原先只在工作日北京 09:30~14:30 跑，
    #   导致周五美股那根要拖到下周一才补上 → 周末看页面就是「纳指好几天没更新」。
    - cron: '30 21 * * 1-5'   # 北京 05:30（周二~周六）
  workflow_dispatch:        # 支持手动触发

permissions:
  contents: write           # 需要写权限来提交数据更新
  pages: write
  id-token: write

concurrency:
  group: daily-update
  cancel-in-progress: false

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 拉取数据
        run: |
          echo "── 开始拉数据 ──"
          python 拉数据.py
        continue-on-error: false

      # ── 金融要闻（2026-10-28 新增）──
      - name: 抓取金融要闻
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          echo "── 抓取金融要闻 ──"
          if [ -z "$DEEPSEEK_API_KEY" ]; then
            echo "⚠️ 未配置 DEEPSEEK_API_KEY secret，跳过 AI 翻译与事件说明"
            echo "   如需启用：仓库 Settings → Secrets → Actions → New secret"
            echo "   名称填 DEEPSEEK_API_KEY"
            exit 0
          fi
          cd 金融要闻
          python run_daily.py
          SN=0
          cd ..
          echo "── 要闻数据 ──"
          python - <<'PY' || SN=1
          import json, sys, datetime
          d = json.load(open('金融要闻/_data/news.json'))
          items = d.get('items', [])
          zh = sum(1 for x in items if x.get('title_zh'))
          ai = sum(1 for x in items if x.get('event'))
          dn = sum(1 for x in items if x.get('data_note'))
          print(f"  新闻 {d['total']} 条｜中文 {zh}｜AI 事件 {ai}｜数据佐证 {dn}")
          print(f"  生成时间 {d['generatedAt']}")
          print(f"  行情 A股 {len(d['market']['stocks'])} / 商品 {len(d['market']['commodities'])}")
          # ⚠️ 云端强制校验：AI 必须真的跑通，不能只看步骤 success
          age_h = (datetime.datetime.now() - datetime.datetime.strptime(d['generatedAt'], '%Y-%m-%d %H:%M')).total_seconds()/3600
          bad = []
          if zh < d['total']: bad.append(f"中文仅 {zh}/{d['total']}")
          if ai < d['total']: bad.append(f"AI 事件仅 {ai}/{d['total']}")
          if age_h > 6:       bad.append(f"生成时间过旧（{age_h:.1f}h 前）")
          if bad:
              print(f"❌ 要闻数据未真正更新：{'；'.join(bad)}")
              sys.exit(1)
          print("✅ 要闻数据校验通过（中文/AI 均完整且新鲜）")
          PY
          echo "SN=$SN" >> $GITHUB_ENV
        # 不阻塞指数数据部署（用 step 输出标记，最后统一判定）

      - name: 生成页面与发布包
        run: |
          echo "── 生成页面 ──"
          python 生成工作台.py

      - name: 校验数据完整性
        run: |
          python - <<'PY'
          import json
          d = json.load(open('_data/indicators.json'))
          c = d['segCounts']
          print(f"回撤段数: A={c['A']} B={c['B']} C={c['C']}")
          print(f"数据区间: {d['start']} ~ {d['end']}（{len(d['dates'])} 交易日）")

          # ⚠️ 只校验「结构与量级合理」，不写死具体段数：
          #    C 级段数会随数据增长（每出现一次 5~10% 回撤就 +1，实测已从 22→23）
          #    A/B 级也会缓慢增长。写死会导致每日更新必然失败。
          assert d['start'] == '2002-10-09', f"起点错误: {d['start']}"
          assert len(d['dates']) > 6000, f"数据量异常: {len(d['dates'])}"
          assert c['A'] >= 10, f"A 级段数异常偏低: {c['A']}"
          assert c['B'] >= 13, f"B 级段数异常偏低: {c['B']}"
          assert c['C'] >= 22, f"C 级段数异常偏低: {c['C']}"
          assert len(d['segments']) == c['A']+c['B']+c['C'], "分段计数与明细不一致"

          last = d['end']
          print(f"✅ 数据校验通过（最新 {last}）")
          PY

      - name: 检查数据是否有变化
        id: diff
        run: |
          if git diff --quiet -- _data 金融要闻/_data 2>/dev/null || git diff --quiet -- _data; then
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "ℹ️ 数据无变化（可能是非交易日或已更新），跳过部署"
          else
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "✅ 数据有变化，将提交并部署"
            git diff --stat -- _data | tail -5
          fi

      - name: 提交数据更新（若有变化）
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A _data 金融要闻/_data   # 只提交数据；dist 与 工作台.html 每次构建重新生成
          if git diff --staged --quiet; then
            echo "无数据变化，跳过提交"
          else
            git commit -m "自动更新数据 $(date -u '+%Y-%m-%d %H:%M UTC')"
            git push
          fi

      - name: 要闻失败则整体失败（避免静默）
        if: env.SN == '1'
        run: |
          echo "❌ 金融要闻未真正更新（见上一步输出）"
          echo "   常见原因：DEEPSEEK_API_KEY 未配置或无效、API 余额不足、数据源失败"
          exit 1

      - name: 上传 Pages 产物
        # ⚠️ 2026-11-07：加 always()，否则「要闻失败」那步 exit 1 之后 Pages 部署被整体跳过
        if: always() && (steps.diff.outputs.changed == 'true' || github.event_name != 'schedule')
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
        continue-on-error: true      # Pages 未开启时此步会失败，但不阻塞兜底分支

      - name: 部署到 GitHub Pages
        id: deploy
        if: always() && (steps.diff.outputs.changed == 'true' || github.event_name != 'schedule')
        uses: actions/deploy-pages@v4
        continue-on-error: true

      # ── 兜底：同时把 dist/ 推到 gh-pages 分支 ──
      # 这样即使你选「Deploy from a branch」也能出链接；
      # 若选「GitHub Actions」，上面那步会生效，本步无害。
      - name: 兜底推送 gh-pages 分支
        if: always() && (steps.diff.outputs.changed == 'true' || github.event_name != 'schedule')
        run: |
          cd dist
          git init -q -b gh-pages
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "部署 $(date -u '+%Y-%m-%d %H:%M UTC')" || echo "无变化"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" gh-pages
          echo "✅ 已推送 gh-pages 分支"
