name: 每日更新数据并部署

# ═══════════════════════════════════════════════════════════════
# 用途：每个工作日自动拉取最新数据 → 重新生成页面 → 部署到 GitHub Pages
# 特点：跑在 GitHub 云端，**不依赖本机开机**
#
# ⚠️ 前置条件（在仓库 Settings 里设置）
#   Settings → Pages → Source 选「GitHub Actions」
#
# ⚠️ FRED 封锁说明
#   本机的 fred.stlouisfed.org 被封，但 GitHub 云端**通常不受影响**；
#   脚本逻辑是「本地缓存优先 + 替代源拼接」，云端会自动补齐并提交缓存更新。
# ═══════════════════════════════════════════════════════════════

on:
  push:
    branches: [main]        # 推送即触发（便于验证；数据提交也会触发一次）
  schedule:
    # 每周一至五 01:30 UTC = 北京时间 09:30
    # （美股周一收盘对应北京时间周二凌晨，09:30 跑能取到前一日收盘）
    - cron: '30 1 * * 1-5'
  workflow_dispatch:        # 支持手动触发（便于首次验证）

permissions:
  contents: write           # 需要写权限来提交数据更新
  pages: write
  id-token: write

concurrency:
  group: daily-update
  cancel-in-progress: false

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 拉取数据
        run: |
          echo "── 开始拉数据 ──"
          python 拉数据.py
        continue-on-error: false

      - name: 生成页面与发布包
        run: |
          echo "── 生成页面 ──"
          python 生成工作台.py

      - name: 校验数据完整性
        run: |
          python - <<'PY'
          import json
          d = json.load(open('_data/indicators.json'))
          c = d['segCounts']
          print(f"回撤段数: A={c['A']} B={c['B']} C={c['C']}")
          print(f"数据区间: {d['start']} ~ {d['end']}（{len(d['dates'])} 交易日）")

          # ⚠️ 只校验「结构与量级合理」，不写死具体段数：
          #    C 级段数会随数据增长（每出现一次 5~10% 回撤就 +1，实测已从 22→23）
          #    A/B 级也会缓慢增长。写死会导致每日更新必然失败。
          assert d['start'] == '2002-10-09', f"起点错误: {d['start']}"
          assert len(d['dates']) > 6000, f"数据量异常: {len(d['dates'])}"
          assert c['A'] >= 10, f"A 级段数异常偏低: {c['A']}"
          assert c['B'] >= 13, f"B 级段数异常偏低: {c['B']}"
          assert c['C'] >= 22, f"C 级段数异常偏低: {c['C']}"
          assert len(d['segments']) == c['A']+c['B']+c['C'], "分段计数与明细不一致"

          last = d['end']
          print(f"✅ 数据校验通过（最新 {last}）")
          PY

      - name: 提交数据更新（若有变化）
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A _data          # 只提交数据；dist 与 工作台.html 每次构建重新生成，避免与本地冲突
          if git diff --staged --quiet; then
            echo "无数据变化，跳过提交"
          else
            git commit -m "自动更新数据 $(date -u '+%Y-%m-%d %H:%M UTC')"
            git push
          fi

      - name: 上传 Pages 产物
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
        continue-on-error: true      # Pages 未开启时此步会失败，但不阻塞兜底分支

      - name: 部署到 GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
        continue-on-error: true

      # ── 兜底：同时把 dist/ 推到 gh-pages 分支 ──
      # 这样即使你选「Deploy from a branch」也能出链接；
      # 若选「GitHub Actions」，上面那步会生效，本步无害。
      - name: 兜底推送 gh-pages 分支
        if: always()
        run: |
          cd dist
          git init -q -b gh-pages
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "部署 $(date -u '+%Y-%m-%d %H:%M UTC')" || echo "无变化"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" gh-pages
          echo "✅ 已推送 gh-pages 分支"
