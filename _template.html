<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>开源工作台 · 指数情况</title>
<!-- PWA：加到手机主屏后可全屏运行、离线可看 -->
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="开源工作台">
<meta name="theme-color" content="#2563eb">
<style>
  :root{
    --bg:#f5f6f8; --card:#fff; --line:#e8eaed; --txt:#1f2328; --sub:#6b7280; --faint:#9aa4b2;
    --up:#dc2626; --down:#16a34a; --warn:#d97706; --ok:#15803d; --info:#2563eb;
    --lvA:#dc2626; --lvB:#f59e0b; --lvC:#fcd34d;
    --shadow:0 1px 3px rgba(0,0,0,.06),0 1px 2px rgba(0,0,0,.04);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--txt);font:14px/1.6 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;padding:16px;max-width:1280px;margin:0 auto}
  h1{font-size:20px;font-weight:600}
  .sub{color:var(--sub);font-size:12px}
  .nav{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 16px;margin-bottom:14px;box-shadow:var(--shadow);display:flex;flex-wrap:wrap;gap:8px;align-items:center}
  .nav .brand{font-weight:600;margin-right:12px}
  .nav button{font:inherit;font-size:13px;padding:6px 14px;border:1px solid var(--line);background:#fff;border-radius:8px;color:var(--txt)}
  .nav button.on{background:var(--info);color:#fff;border-color:var(--info)}
  .nav button.off{color:var(--faint);background:#fafbfc}
  .nav .gap{flex:1}
  .sec{margin:18px 0 8px;font-size:15px;font-weight:600;display:flex;align-items:center;gap:8px}
  .sec .tag{font-size:11px;font-weight:400;color:var(--sub);border:1px solid var(--line);border-radius:4px;padding:1px 6px;background:#fff}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
  .idxcard{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px;box-shadow:var(--shadow);cursor:pointer;transition:.15s}
  .idxcard:hover{border-color:var(--info);transform:translateY(-1px)}
  .idxcard.off{cursor:not-allowed;opacity:.6;background:#fafbfc}
  .idxcard.off:hover{border-color:var(--line);transform:none}
  .idxcard .nm{font-weight:600;font-size:15px}
  .idxcard .code{color:var(--sub);font-size:11px;font-family:ui-monospace,monospace;margin-top:2px}
  .idxcard .val{font-size:22px;font-weight:600;font-variant-numeric:tabular-nums;margin-top:8px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px;box-shadow:var(--shadow)}
  .btn-back{font-size:12px;color:var(--info);cursor:pointer;background:none;border:none;padding:0;margin-bottom:10px}
  #mainChart{width:100%;height:430px}
  .chartbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:8px}
  .chartbar .title{font-weight:600;font-size:15px}
  /* ── 全屏浏览（手机端看图用） ── */
  .btn-full{font-size:11px;padding:3px 10px;border-radius:12px;border:1px solid var(--line);
            background:#fff;color:var(--info);cursor:pointer;white-space:nowrap}
  .btn-full:hover{border-color:var(--info)}
  #chartCard.fs{position:fixed;top:0;left:0;right:0;bottom:0;z-index:200;
                border-radius:0;margin:0;
                display:flex;flex-direction:column;
                /* PWA standalone 下 100vh 可能算错，用 dvh 优先、vh 兜底 */
                height:100vh;
                height:100dvh;
                /* 刘海屏/底部横条安全区适配 */
                padding:calc(6px + env(safe-area-inset-top)) calc(8px + env(safe-area-inset-right))
                        calc(6px + env(safe-area-inset-bottom)) calc(8px + env(safe-area-inset-left));
                background:#fff;overflow:hidden}
  #chartCard.fs #mainChart{flex:1 1 auto !important;height:auto !important;
                           min-height:180px;width:100%}
  #chartCard.fs .chartbar{margin-bottom:4px}
  #chartCard.fs .legend{font-size:9.5px;gap:6px;margin-top:3px;max-height:34px;overflow:auto;
                        line-height:1.5}
  #chartCard.fs .selbar{margin-top:3px;padding-top:3px;max-height:44px;overflow:auto;gap:3px}
  #chartCard.fs .sel{font-size:9.5px;padding:2px 6px}
  #chartCard.fs .legend .swatch{width:8px;height:8px}
  #chartCard.fs .btn-full{background:var(--info);color:#fff;border-color:var(--info)}
  body.fs-open{overflow:hidden}
  /* ── 纯 CSS 横屏（iOS 不支持 orientation.lock 时的兜底）──
     原理：把卡片转 90°，宽高互换 → 竖屏手机也能看到「横向」长图。
     尺寸用 JS 写入的 --fl-w/--fl-h 变量，避免 vh/vw 在动态地址栏下算错。 */
  #chartCard.fs.rot{
    /* ⚠️ 必须 !important：.fs 的 height:100dvh 同权重且靠后，会覆盖这里 */
    width:var(--fl-w) !important;
    height:var(--fl-h) !important;
    top:50% !important; left:50% !important;
    right:auto !important; bottom:auto !important;
    transform:translate(-50%,-50%) rotate(90deg) !important;
    transform-origin:center center;
  }
  /* ── 横屏提示（iOS 不支持方向锁定时引导用户手动横屏）── */
  #rotateHint{display:none;position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);
              z-index:210;background:rgba(15,23,42,.88);color:#fff;border-radius:12px;
              padding:18px 22px;font-size:13px;text-align:center;line-height:1.9;
              max-width:78vw;pointer-events:none}
  #rotateHint.show{display:block}
  #rotateHint .ico{font-size:28px;display:block;margin-bottom:6px}
  /* 全屏 + 横屏时：压缩图例与多选，把空间全给图表 */
  @media (orientation: landscape){
    #chartCard.fs .legend{max-height:24px;font-size:9px;gap:8px;flex-wrap:nowrap;overflow-x:auto}
    #chartCard.fs .selbar{max-height:30px;flex-wrap:nowrap;overflow-x:auto}
    #chartCard.fs #mainChart{min-height:120px}
  }
  /* 纯 CSS 旋转模式（.rot）：图例与多选改为**悬浮覆盖**，不占布局空间
     → 图表独占整个卡片，最大化可视面积 */
  #chartCard.fs.rot{position:fixed}
  #chartCard.fs.rot #mainChart{flex:1 1 auto !important;min-height:0 !important;
                               width:100% !important;height:100% !important}
  #chartCard.fs.rot .chartbar{margin:0;position:absolute;top:4px;left:0;right:0;
                               z-index:5;padding:0 4px;pointer-events:none}
  #chartCard.fs.rot .chartbar .title{font-size:12px;background:rgba(255,255,255,.82);
                                      border-radius:5px;padding:1px 6px;display:inline-block;
                                      max-width:72%;overflow:hidden;text-overflow:ellipsis;
                                      white-space:nowrap}
  /* 图例：底部悬浮半透明条 */
  #chartCard.fs.rot .legend{position:absolute;left:0;right:0;bottom:30px;z-index:5;
                             max-height:20px;font-size:8.5px;gap:7px;line-height:1.3;
                             flex-wrap:nowrap;overflow-x:auto;overflow-y:hidden;
                             margin:0;padding:2px 6px;background:rgba(255,255,255,.86);
                             border-radius:6px}
  #chartCard.fs.rot .legend .swatch{width:7px;height:7px;margin-right:3px}
  /* 多选：最底部悬浮条 */
  #chartCard.fs.rot .selbar{position:absolute;left:0;right:0;bottom:4px;z-index:6;
                             max-height:24px;flex-wrap:nowrap;overflow-x:auto;overflow-y:hidden;
                             margin:0;padding:2px 6px;gap:4px;
                             background:rgba(255,255,255,.92);border-radius:6px;
                             border-top:none}
  #chartCard.fs.rot .sel{font-size:8.5px;padding:1px 6px;white-space:nowrap}
  #chartCard.fs.rot .sel-reset{font-size:8.5px}
  /* ── 移动端适配 ── */
  @media (max-width: 640px){
    body{padding:10px}
    #mainChart{height:56vh;min-height:280px}   /* 手机上给足高度 */
    .grid{grid-template-columns:1fr}
    .mgrid{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
    .chartbar .title{font-size:13px;flex:1 1 100%}
    .btn-full{font-size:12px;padding:5px 12px}  /* 手指好点 */
    .nav button{font-size:12px;padding:5px 10px}
    .sel{font-size:10px;padding:3px 8px}
  }
  /* 全屏时给图例/多选留足空间，图表占满剩余 */
  #chartCard.fs #mainChart{height:auto !important;min-height:0 !important}
  #chartCard.fs .chartbar{flex-wrap:nowrap}
  #chartCard.fs .chartbar .title{flex:1 1 auto;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  #chartCard.fs .chartbar .title::after{content:" ▲ 最新";font-weight:400;font-size:10px;color:var(--ok)}
  .chip{font-size:11px;padding:2px 8px;border-radius:10px;border:1px solid var(--line);background:#fff;color:var(--sub);cursor:pointer}
  .chip.on{background:var(--info);color:#fff;border-color:var(--info)}
  .legend{font-size:11px;color:var(--sub);margin-top:8px;display:flex;flex-wrap:wrap;gap:14px;align-items:center}
  .swatch{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px;vertical-align:middle}
  /* ── 关键数据条带（走势图下方，五类上下排列）── */
  .kbar{margin-top:10px;background:#fff;border:1px solid var(--line);border-radius:8px;
        overflow:hidden}
  .kbar .krow{display:flex;align-items:center;gap:10px;padding:7px 12px;
              border-bottom:1px solid #f1f3f5}
  .kbar .krow:last-child{border-bottom:none}
  .kbar .ktag{flex:0 0 62px;font-size:11px;font-weight:600;color:#fff;border-radius:5px;
              padding:3px 0;text-align:center;letter-spacing:.5px}
  .kbar .kitems{flex:1;display:flex;flex-wrap:wrap;gap:6px 14px;align-items:baseline}
  .kbar .ki{display:inline-flex;align-items:baseline;gap:4px;white-space:nowrap}
  .kbar .ki .kn{font-size:11px;color:var(--sub)}
  .kbar .ki .kv{font-size:14px;font-weight:600;font-variant-numeric:tabular-nums}
  .kbar .ki .kst{font-size:10px;padding:1px 5px;border-radius:4px;margin-left:2px}
  /* 状态色 */
  .st-hot{background:#fee2e2;color:#b91c1c}
  .st-cold{background:#dcfce7;color:#15803d}
  .st-mid{background:#f1f5f9;color:#475569}
  .st-warn{background:#fef3c7;color:#b45309}
  /* 五类标签配色 */
  .kt-trend{background:#2563eb}
  .kt-mom{background:#dc2626}
  .kt-vola{background:#f59e0b}
  .kt-volume{background:#16a34a}
  .kt-senti{background:#7c3aed}
  @media (max-width:640px){
    .kbar .krow{padding:6px 9px;gap:7px}
    .kbar .ktag{flex:0 0 50px;font-size:10px}
    .kbar .kitems{gap:4px 10px}
    .kbar .ki .kv{font-size:13px}
    .kbar .ki .kn{font-size:10px}
  }
  .cat{margin-top:14px}
  .cat h3{font-size:13px;font-weight:600;margin:14px 0 8px;display:flex;align-items:center;gap:6px}
  .cat h3 .dot{width:6px;height:6px;border-radius:50%;background:var(--info)}
  .mgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(215px,1fr));gap:10px}
  .mcard{background:#fff;border:1px solid var(--line);border-radius:8px;padding:11px 13px;cursor:pointer;transition:.15s}
  .mcard:hover{border-color:var(--info);box-shadow:0 2px 8px rgba(37,99,235,.08)}
  .mcard.on{border-color:var(--info);background:#f8fbff}
  .mcard.lock{background:#fafbfc}
  .mcard.lock:hover{border-color:var(--line);box-shadow:none}
  .mcard .k{font-size:12px;color:var(--sub);display:flex;align-items:center;gap:5px;flex-wrap:wrap}
  .mcard .v{font-size:19px;font-weight:600;font-variant-numeric:tabular-nums;margin-top:3px}
  .mcard .n{font-size:10.5px;color:var(--faint);margin-top:3px;line-height:1.5}
  .mcard .q{width:14px;height:14px;border-radius:50%;border:1px solid var(--faint);color:var(--faint);font-size:10px;line-height:12px;text-align:center;flex:none;cursor:pointer}
  .lock-tag{font-size:10px;color:var(--warn);border:1px solid #fde68a;background:#fffbeb;border-radius:3px;padding:0 4px}
  .click-tag{font-size:10px;color:var(--info)}
  .up{color:var(--up)} .down{color:var(--down)} .warn{color:var(--warn)} .ok{color:var(--ok)} .info{color:var(--info)}
  .modal{position:fixed;inset:0;background:rgba(15,23,42,.42);display:none;align-items:center;justify-content:center;z-index:99;padding:20px}
  .modal.show{display:flex}
  .modal .box{background:#fff;border-radius:12px;max-width:560px;width:100%;padding:22px 24px;box-shadow:0 20px 50px rgba(0,0,0,.2);max-height:82vh;overflow:auto}
  .modal h4{font-size:16px;margin-bottom:4px}
  .modal .val{font-size:12.5px;color:var(--sub);margin-bottom:10px;line-height:1.7}
  .modal dt{font-size:12px;font-weight:600;color:var(--info);margin-top:12px}
  .modal dd{font-size:13px;color:var(--txt);margin-top:3px;line-height:1.75}
  .modal .close{margin-top:18px;text-align:right}
  .modal .close button{font:inherit;font-size:13px;padding:6px 18px;border:1px solid var(--line);background:#fff;border-radius:8px;cursor:pointer}
  footer{color:var(--sub);font-size:11px;text-align:center;margin:26px 0 10px;line-height:1.9}
  .srcbox{background:#fafbfc;border:1px solid var(--line);border-radius:8px;padding:11px 13px;font-size:11.5px;color:var(--sub);line-height:1.9;margin-top:12px}
  .warnbox{background:#fffbeb;border:1px solid #fde68a;border-radius:8px;padding:10px 12px;font-size:11.5px;color:#92400e;line-height:1.8;margin-top:10px}
  /* 多选面板（Q3.c：多选 + 记住选择） */
  .selbar{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px;padding-top:10px;border-top:1px dashed var(--line);align-items:center}
  .selbar .lbl{font-size:11px;color:var(--sub);margin-right:2px}
  .sel{font-size:11px;padding:3px 9px;border-radius:12px;border:1px solid var(--line);
       background:#fff;color:var(--sub);cursor:pointer;user-select:none;transition:.12s}
  .sel:hover{border-color:var(--info)}
  .sel.on{background:var(--info);color:#fff;border-color:var(--info)}
  .sel i{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:4px;vertical-align:middle}
  .sel-reset{font-size:11px;color:var(--info);background:none;border:none;cursor:pointer;padding:3px 6px;text-decoration:underline}
</style>
</head>
<body>

<div class="nav">
  <span class="brand">开源工作台</span>
  <button id="nav1" class="on">① 指数情况</button>
  <button class="off" title="模块名称待定">② 待定</button>
  <button class="off" title="模块名称待定">③ 待定</button>
  <span class="gap"></span>
  <span class="sub" id="genAt"></span>
</div>

<div id="viewList">
  <div class="sec">指数列表 <span class="tag">本期仅纳指100 有数据</span></div>
  <div class="grid" id="idxGrid"></div>
</div>

<div id="viewDetail" style="display:none">
  <button class="btn-back" onclick="backToList()">← 返回指数列表</button>
  <div class="card" id="chartCard">
    <div class="chartbar">
      <span class="title" id="chartTitle"></span>
      <span style="flex:1"></span>
      <span class="chip on" id="chipIdx" onclick="showIndexChart()">指数走势</span>
      <button class="btn-full" id="btnFull" onclick="toggleFull()" title="全屏看图（手机推荐）">⛶ 全屏</button>
    </div>
    <div id="mainChart"></div>
    <div class="legend" id="chartLegend"></div>
    <div class="selbar" id="selBar"></div>
  </div>
  <div class="kbar" id="keyBar"></div>
  <div class="cat" id="metricCats"></div>
  <div class="srcbox" id="srcBox"></div>
</div>

<div id="rotateHint">
  <span class="ico">📱↻</span>
  请把手机<b>横过来</b><br>
  <span style="color:#cbd5e1;font-size:12px">横屏看走势图更清晰</span>
</div>

<div class="modal" id="modal" onclick="if(event.target===this)closeModal()">
  <div class="box">
    <h4 id="mTitle"></h4>
    <div class="val" id="mVal"></div>
    <div id="mBody"></div>
    <div class="close"><button onclick="closeModal()">关闭</button></div>
  </div>
</div>

<footer>
  数据：FRED · CBOE · CNN · 蛋卷 · nikkei225jp · SEC EDGAR｜本页为个人研究记录工具，<b>不构成投资建议</b><br>
  <span id="footNote"></span>
</footer>

<script>/*__ECHARTS__*/</script>
<script>
const D = /*__PAYLOAD__*/;

const fmt=(x,n=2)=> (x===null||x===undefined||isNaN(x)) ? '—' : Number(x).toFixed(n);
const sgn=(x,n=2)=> (x>0?'+':'')+fmt(x,n);
const cls=x=> x>0?'up':(x<0?'down':'');
const LV_COLOR={A:'#dc2626',B:'#f59e0b',C:'#fcd34d'};
const LV_NAME={A:'A级 ≥15%',B:'B级 10-15%',C:'C级 5-10%'};
const last=a=> (a&&a.length)? a[a.length-1] : null;
const srcOf=m=> (typeof m.src==='function')? m.src() : m.src;
function pickSeries(rows){
  const o={dates:[],values:[]};
  (rows||[]).forEach(r=>{ o.dates.push(r[0]); o.values.push(r[1]); });
  return o;
}

/* ⚠️ 统计量必须在 METRICS 之前算好（METRICS 初始化时会读它们，否则触发 TDZ） */
function st52(rows){
  const t=(rows||[]).slice(-252).map(r=>r[1]);
  if(!t.length) return {low:null,high:null};
  return {low:Math.min.apply(null,t), high:Math.max.apply(null,t)};
}
D.vxnSt52 = st52(D.vxn.rows);
D.vixSt52 = st52(D.vix.rows);
D.series = {
  ndx:{dates:D.indicators.dates,values:D.indicators.close},
  kdj_k:{dates:D.indicators.dates,values:D.indicators.kdj_k},
  kdj_d:{dates:D.indicators.dates,values:D.indicators.kdj_d},
  kdj_j:{dates:D.indicators.dates,values:D.indicators.kdj_j},
  volratio:{dates:D.indicators.dates,values:D.indicators.volratio},
  boll_width:{dates:D.indicators.dates,values:D.indicators.boll_width},
  ma200:{dates:D.indicators.dates,values:D.indicators.ma200},
  ma250:{dates:D.indicators.dates,values:D.indicators.ma250},
  ma500:{dates:D.indicators.dates,values:D.indicators.ma500},
  r500:{dates:D.indicators.dates,values:D.indicators.r500},
  r250:{dates:D.indicators.dates,values:D.indicators.r250},
  rsi14:{dates:D.indicators.dates,values:D.indicators.rsi14},
  vxn:pickSeries(D.vxn.rows), vix:pickSeries(D.vix.rows), cnn:pickSeries(D.cnn.rows),
  dividend:pickSeries(D.dividend.rows),
  pe:pickSeries(D.danjuan.pe.rows), pb:pickSeries(D.danjuan.pb.rows),
  // ⚠️ ROE 原始值是小数（0.3152），曲线须与卡片统一为百分数
  roe:pickSeries(D.danjuan.roe.rows.map(r=>[r[0], r[1]*100]))
};

/* ========== 指标定义（含白话解释）========== */
const METRICS = [
  {cat:'估值', key:'pe', name:'PE-TTM 市盈率', hist:'pe', dec:2,
   get:()=>D.danjuan_now.pe, src:'蛋卷 detail/NDX', date:()=>D.danjuan_now.date,
   what:'市值 ÷ 过去12个月净利润。',
   read:'越低越便宜。注意指数是「合计市值÷合计净利润」，不是成分股PE的平均。',
   cur:'近10年分位 '+(D.danjuan_now.pe_percentile!=null?(D.danjuan_now.pe_percentile*100).toFixed(1)+'%':'—'),
   caveat:'⚠️ 口径冲突：蛋卷 '+fmt(D.danjuan_now.pe)+'（'+D.danjuan_now.date+'）／Siblis 35.24（2026-06-30）／Nasdaq 官方 35.23（2026-06-30）——三家不可混比。'},
  {cat:'估值', key:'fpe', name:'远期市盈率', hist:null, dec:2, locked:true,
   get:()=>23.26, src:'Siblis（仅8个快照）', date:()=>'2026-09-30',
   what:'市值 ÷ 未来12个月一致预期净利润。',

function renderIndexList(){
  const g=document.getElementById('idxGrid');
  g.innerHTML='';
  INDEXES.forEach(ix=>{
    const d=document.createElement('div');
    d.className='idxcard'+(ix.on?'':' off');
    if(ix.on){
      const c=D.indicators.close, ch=c.length>1? c[c.length-1]/c[c.length-2]-1 : null;
      d.innerHTML='<div class="nm">'+ix.name+'</div><div class="code">'+ix.code+'</div>'+
        '<div class="val">'+fmt(last(c))+'</div>'+
        '<div class="sub '+cls(ch)+'" style="font-size:12px">'+(ch===null?'':'当日 '+sgn(ch*100,2)+'%')+'</div>'+
        '<div class="sub" style="font-size:11px;margin-top:6px">数据日 '+D.indicators.end+'</div>';
      d.onclick=()=>openIndex(ix.id);
    }else{
      d.innerHTML='<div class="nm" style="color:var(--faint)">'+ix.name+'</div><div class="code">'+ix.code+'</div>'+
        '<div class="val" style="color:var(--faint)">—</div>'+
        '<div class="sub" style="font-size:11px;margin-top:6px">'+ix.hint+'</div>';
    }
    g.appendChild(d);
  });
}

    const raw=JSON.parse(localStorage.getItem(SEL_KEY)||'null');
    // 兼容旧格式（纯数组）与新格式（{ver, keys}）
    const savedKeys = Array.isArray(raw) ? raw : (raw && Array.isArray(raw.keys) ? raw.keys : null);
    const savedVer  = Array.isArray(raw) ? 'v1' : (raw && raw.ver);
    if(savedKeys && savedKeys.length){
      const valid=savedKeys.filter(k=>IDX_SERIES.some(d=>d.key===k));
      if(valid.length){
        const set=new Set(valid);
        // 版本升级时：补入新默认项（用户此前未见过它，视为「新增」而非「用户主动取消」）
        if(savedVer!==SEL_VER){
          DEFAULT_SEL.forEach(k=>set.add(k));
          saveSelWith(set);          // 立即写成新版本
        }
        return set;
      }
    }
  }catch(e){}
  return new Set(DEFAULT_SEL);
}
function saveSelWith(set){
  try{ localStorage.setItem(SEL_KEY, JSON.stringify({ver:SEL_VER, keys:[...set]})); }catch(e){}
}
function saveSel(){ saveSelWith(selected); }

/* 二分：找日频轴中 ≤ 目标日期的最后一个下标 */
function floorIdx(axis,d){
  let lo=0,hi=axis.length-1,pos=-1;
  while(lo<=hi){ const mid=(lo+hi)>>1; if(axis[mid]<=d){pos=mid;lo=mid+1;} else hi=mid-1; }
  return pos;
}
/* 把周频指标映射到日频轴（空缺处用 null，配合 connectNulls 连续画） */
function mapToDaily(histKey){
  const ser=D.series[histKey];
  const out=new Array(D.indicators.dates.length).fill(null);
  if(!ser||!ser.dates.length) return out;
  for(let i=0;i<ser.dates.length;i++){
    const pos=floorIdx(D.indicators.dates, ser.dates[i]);
    if(pos>=0) out[pos]=ser.values[i];
  }
  return out;
}
/* 取某序列在日频轴上的值 */
function valuesOnDaily(def){
  if(def.own) return D.indicators[def.own];
  return mapToDaily(def.hist||def.key);
}
/* 把 NDX 映射到任意时间轴 */
function ndxOnAxis(xDates){
  const axis=D.indicators.dates, out=[];
  for(const d of xDates){ const p=floorIdx(axis,d); out.push(p>=0? D.indicators.close[p]:null); }
  return out;
}

/* ══════════ 多选面板 ══════════ */
function renderSelBar(){
  const box=document.getElementById('selBar');
  const isIdx=document.getElementById('chipIdx').classList.contains('on');
  if(!isIdx){ box.innerHTML=''; return; }
  let h='<span class="lbl">可选数据（点选，可多选）：</span>';
  GROUP_ORDER.forEach(g=>{
    IDX_SERIES.filter(s=>s.group===g).forEach(s=>{
      const on=selected.has(s.key);
      h+='<span class="sel'+(on?' on':'')+'" onclick="toggleSeries(\''+s.key+'\')" title="'+GROUPS[g].name+'｜'+s.src+'">'
        +'<i style="background:'+s.color+'"></i>'+s.name+'</span>';
    });
  });
  h+='<button class="sel-reset" onclick="resetSel()">恢复默认</button>';
  box.innerHTML=h;
}
function toggleSeries(k){
  if(selected.has(k)) selected.delete(k); else selected.add(k);
  if(!selected.size) selected.add('ndx');
  saveSel(); showIndexChart();
}
function resetSel(){ selected=new Set(['ndx','ma200','ma250','ma500']); saveSel(); showIndexChart(); }

/* ══════════ 通用图表配置 ══════════ */
/* zoomStart: 0~100，默认显示区间起点（100=只看最后）
   ⚠️ 量比/KDJ/布林带宽这类日频振荡指标，全历史挤在一屏会成噪声，
      故默认只看近 2 年；长序列指标（PE等）保持全区间 */
function baseOption(xDates, zoomStart){ return {
  animation:false,
  grid:(()=>{
    // 旋转横屏时按「实际绘图区宽度」判断，而不是视口
    const narrow = (typeof window!=='undefined' && !isFull && window.innerWidth<520);
    return narrow ? {left:46,right:58,top:42,bottom:56}
                  : {left:62,right:70,top:34,bottom:50};
  })(),
  tooltip:{trigger:'axis',axisPointer:{type:'cross'}},
  xAxis:{type:'category',data:xDates,boundaryGap:false,
    axisLabel:{fontSize:10,color:'#6b7280',hideOverlap:true,
      showMinLabel:true, showMaxLabel:true,
      // ⚠️ 类目轴 formatter 只收 (value, index)，没有第三个参数
      //    用闭包捕获长度，避免 undefined.length 抛错中断整个渲染
      formatter:(()=>{ const n=xDates.length;
        return (v,i)=> (i===0||i===n-1)? v : String(v).slice(2); })()},
    axisLine:{lineStyle:{color:'#e8eaed'}}},
  dataZoom:[{type:'inside',start:zoomStart||0,end:100},
    {type:'slider',height:18,bottom:16,start:zoomStart||0,end:100,borderColor:'#e8eaed',
     fillerColor:'rgba(37,99,235,.10)'}],
  series:[]
};}

/* 按「用到的量纲组」生成 Y 轴：左侧一组、右侧多组错位排列 */
function buildAxes(activeGroups){
  const axes=[];
  GROUP_ORDER.forEach(g=>{
    const G=GROUPS[g], on=activeGroups.has(g);
    if(G.axis===0 && G.side==='left'){
      axes[0]={type:'value',scale:true,position:'left',show:true,
        axisLabel:{fontSize:10,color:on?'#6b7280':'#e5e7eb'},
        splitLine:{show:on,lineStyle:{color:'#f1f3f5'}}};
    }else{
      axes[G.axis]={type:'value',scale:true,position:'right',offset:G.offset,show:on,
        axisLabel:{fontSize:10,color:on?'#6b7280':'#e5e7eb',formatter:v=>v},
        splitLine:{show:false},
        axisLine:{show:on,lineStyle:{color:'#e8eaed'}},
        name:on? G.name:'' , nameTextStyle:{fontSize:9,color:'#9aa4b2',align:'left'}};
    }
  });
  return axes;
}

/* ══════════ 指数走势图（第②层）══════════ */
function showIndexChart(){
  curMetric=null; renderMetricCards();
  document.getElementById('chipIdx').classList.add('on');
  const _h1=document.getElementById('chipHint'); if(_h1) _h1.textContent='';
  document.getElementById('chartTitle').innerHTML='纳斯达克100 走势（2002-10-09 起）'+
    '<span class="chip" style="margin-left:8px">数据日 '+D.indicators.end+'</span>';

  const active=IDX_SERIES.filter(s=>selected.has(s.key));
  const groups=new Set(active.map(s=>s.group));

  const opt=baseOption(D.indicators.dates);
  opt.yAxis=buildAxes(groups);

  const md=[];
  D.indicators.segments.forEach(s=>{
    md.push([{xAxis:s.peakDate,itemStyle:{color:LV_COLOR[s.level],opacity:0.20}},{xAxis:s.troughDate}]);
  });

  active.forEach(def=>{
    const ser={name:def.name,type:'line',showSymbol:false,connectNulls:true,
      yAxisIndex:GROUPS[def.group].axis, data:valuesOnDaily(def),
      lineStyle:{width:def.width,color:def.color,type:def.dash?'dashed':'solid'},
      itemStyle:{color:def.color}, z:def.key==='ndx'?5:3};
    if(def.key==='ndx') ser.markArea={silent:true,data:md};
    opt.series.push(ser);
  });
  if(!active.length){
    opt.series.push({name:'NDX 收盘',type:'line',showSymbol:false,connectNulls:true,
      data:D.indicators.close,lineStyle:{width:1.6,color:'#1d4ed8'}});
  }

  /* 悬停：一次性列出**所有已选**数据（缺值显示 —） */
  const idxOfDate=new Map(D.indicators.dates.map((d,i)=>[d,i]));
  opt.tooltip.formatter=function(ps){
    const d0=ps.length? ps[0].axisValue : '';
    const i=idxOfDate.has(d0)? idxOfDate.get(d0) : -1;
    let out='<b>'+d0+'</b><br/>';
    active.forEach(def=>{
      const v=(i>=0)? valuesOnDaily(def)[i] : null;
      const dot='<span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:'
        +def.color+';margin-right:5px"></span>';
      out+=dot+def.name+'：<b>'+(v==null?'—':fmt(v,def.dec))+'</b><br/>';
    });
    const seg=D.indicators.segments.find(s=>d0>=s.peakDate&&d0<=s.troughDate);
    if(seg) out+='<span style="color:'+LV_COLOR[seg.level]+'">■ '+LV_NAME[seg.level]+'：'+
      seg.peakDate+' → '+seg.troughDate+'（'+(seg.depth*100).toFixed(1)+'%）</span>';
    return out;
  };
  chart.setOption(opt,true);

  const c=D.indicators.segCounts;
  let lg=active.map(def=>'<span><span class="swatch" style="background:'+def.color+'"></span>'
      +def.name+'<span style="color:var(--faint)">（'+GROUPS[def.group].name+'）</span></span>').join('');
  lg+='<span><span class="swatch" style="background:'+LV_COLOR.A+';opacity:.5"></span>A级≥15%：'+c.A+'段</span>'
    +'<span><span class="swatch" style="background:'+LV_COLOR.B+';opacity:.5"></span>B级10-15%：'+c.B+'段</span>'
    +'<span><span class="swatch" style="background:'+LV_COLOR.C+';opacity:.5"></span>C级5-10%：'+c.C+'段</span>'
    +'<span style="color:var(--faint)">D级(&lt;5%)不画｜回撤口径：峰→谷单段</span>';
  document.getElementById('chartLegend').innerHTML=lg;
  renderSelBar();
}

/* ══════════ 指标详情图（第③层）══════════ */
const SAME_AXIS_AS_POINTS=['close','ma200','ma250','ma500'];   // 与指数同量纲 → 必须共用左轴
function showMetricChart(m){
  curMetric=m.key; renderMetricCards();
  document.getElementById('chipIdx').classList.remove('on');
  const _h2=document.getElementById('chipHint'); if(_h2) _h2.textContent='点「指数走势」返回';
  document.getElementById('chartTitle').innerHTML=m.name+
    '<span class="chip" style="margin-left:8px">'+srcOf(m)+'｜'+(m.date()||'—')+'</span>';

  const ser=m.hist? D.series[m.hist] : null;
  /* ① 指标用「自身时间轴」（周频指标不再被日频轴切碎成孤点） */
  const xDates = (ser && ser.dates.length) ? ser.dates : D.indicators.dates;
  const same = SAME_AXIS_AS_POINTS.includes(m.key);

  /* 日频振荡类指标默认只显示近 2 年（约 500 点），避免全历史挤成噪声 */
  const DENSE_OSC=['kdj_k','kdj_d','kdj_j','volratio','boll_width','rsi','vxn','vix','cnn'];
  let zoomStart=0;
  if(DENSE_OSC.includes(m.key) && xDates.length>520){
    zoomStart=Math.round((1 - 520/xDates.length)*100);
  }

  const opt=baseOption(xDates, zoomStart);
  opt.yAxis=buildAxes(new Set(same? ['points'] : ['points','value']));

  /* ② 背景 NDX：同量纲时与指标**共用左轴**（真实比例，修复视觉错位）；
        不同量纲时才用右轴（明确标注「仅参考形态」） */
  const bg=ndxOnAxis(xDates);
  opt.series.push({name:'NDX（背景）',type:'line',showSymbol:false,connectNulls:true,
    yAxisIndex: same? 0:1, data:bg,
    lineStyle:{width:1.2,color:'#94a3b8'},itemStyle:{color:'#94a3b8'},tooltip:{show:false},z:1});

  /* 伴随线：某些指标天然是「一组」，点开时一并画出（如 KDJ 的 K/D/J 三条）
     —— 单画 J 值看不出金叉死叉，必须三条同屏才有意义 */
  const COMPANION={
    kdj_j: [
      {key:'kdj_k', name:'K', color:'#d97706'},
      {key:'kdj_d', name:'D', color:'#0d9488'},
    ],
  };

  if(ser){
    opt.series.push({name:m.name,type:'line',showSymbol:false,connectNulls:true,yAxisIndex:0,
      data:ser.values,
      lineStyle:{width:1.7,color: same? '#1d4ed8':'#1d4ed8'},itemStyle:{color:'#1d4ed8'},z:4});

    (COMPANION[m.key]||[]).forEach(c=>{
      const cs=D.indicators[c.key];
      if(!cs) return;
      opt.series.push({name:'KDJ-'+c.name,type:'line',showSymbol:false,connectNulls:true,yAxisIndex:0,
        data:cs, lineStyle:{width:1.4,color:c.color},itemStyle:{color:c.color},z:3});
    });
    if(ser.dates[0]>'2002-10-09'){
      opt.series[1].markLine={silent:true,symbol:'none',
        data:[{xAxis:ser.dates[0],lineStyle:{color:'#f59e0b',type:'dashed'},
          label:{formatter:'数据起点 '+ser.dates[0],fontSize:10,color:'#b45309',position:'insideEndTop'}}]};
    }
  }

  opt.tooltip.formatter=function(ps){
    const d0=ps.length? ps[0].axisValue:'';
    let out='<b>'+d0+'</b><br/>';
    if(ser){
      const i=ser.dates.indexOf(d0);
      const v=(i>=0)? ser.values[i]:null;
      out+='<span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:#1d4ed8;margin-right:5px"></span>'
        +m.name+'：<b>'+(v==null?'—':fmt(v,m.dec))+'</b><br/>';
    }
    const j=xDates.indexOf(d0);
    if(j>=0 && bg[j]!=null){
      out+='<span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:#94a3b8;margin-right:5px"></span>'
        +'NDX（背景）：<b>'+fmt(bg[j])+'</b><br/>';
    }
    return out;
  };
  chart.setOption(opt,true);

  let lg='';
  if(ser){
    lg+='<span><span class="swatch" style="background:#1d4ed8"></span>'+m.name+'</span>'
      +'<span><span class="swatch" style="background:#94a3b8"></span>NDX 走势'
      +(same? '<b>（同轴·真实比例）</b>':'（独立刻度·仅参考形态）')+'</span>';
    if(ser.dates[0]>'2002-10-09'){
      lg+='<span class="warn">数据起点 '+ser.dates[0]+'（非 2002）</span>';
    }
    lg+='<span style="color:var(--faint)">指标用自身时间轴</span>';
  }else{
    lg+='<span class="warn">该指标无免费历史序列，仅显示当期值</span>';
  }
  document.getElementById('chartLegend').innerHTML=lg;
  document.getElementById('selBar').innerHTML='';
}

function renderMetricCards(){
  const box=document.getElementById('metricCats');
  box.innerHTML='';
  CATS.forEach(cat=>{
    const ms=METRICS.filter(m=>m.cat===cat);
    if(!ms.length) return;
    const h=document.createElement('h3');
    h.innerHTML='<span class="dot"></span>'+cat;
    box.appendChild(h);
    const g=document.createElement('div'); g.className='mgrid';
    ms.forEach(m=>{
      const v=m.get();
      const clickable=!!m.hist&&!m.locked;
      const c=document.createElement('div');
      c.className='mcard'+(clickable?'':' lock')+(curMetric===m.key?' on':'');
      const valTxt=(v===null||v===undefined||isNaN(v))?'—':
        (m.isPctVal? (v*100).toFixed(m.dec)+'%' : fmt(v,m.dec));
      c.innerHTML='<div class="k">'+m.name+
        (m.locked?'<span class="lock-tag">仅当期</span>':'<span class="click-tag">可点曲线</span>')+
        '<span class="q">?</span></div>'+
        '<div class="v">'+valTxt+(m.unit&&!m.isPctVal?'<span style="font-size:12px;color:var(--sub)"> '+m.unit+'</span>':'')+'</div>'+
        '<div class="n">'+srcOf(m)+'｜'+(m.date()||'—')+'</div>';
      c.querySelector('.q').onclick=(e)=>{ e.stopPropagation(); openModal(m,v); };
      c.onclick=(e)=>{ if(e.target.classList.contains('q')) return;
        if(clickable) showMetricChart(m); else openModal(m,v); };
      g.appendChild(c);
    });
    box.appendChild(g);
  });
}

/* ══════════ 全屏看图（手机端推荐）══════════
   实现：给图表卡片加 .fs 类 → 固定定位铺满视口；
   同时尝试调用浏览器原生全屏 API（手机可隐藏地址栏，观感更好）。
   退出：按钮 / ESC / 返回列表 / 浏览器返回键。 */
let isFull=false;
function toggleFull(){ isFull? exitFull() : enterFull(); }

function enterFull(){
  const card=document.getElementById('chartCard');
  card.classList.add('fs');
  document.body.classList.add('fs-open');
  isFull=true;
  const btn=document.getElementById('btnFull');
  if(btn) btn.textContent='✕ 退出';

  /* ⚠️ 不调用原生全屏 API（requestFullscreen）：
     PWA standalone（加到主屏）与微信 X5 内核下，它会改变 fixed 参照系
     → 图表被渲染成空白。纯 CSS 全屏在两种模式下都稳定。 */

  /* 横屏模式：尝试锁定横屏（Android PWA/Chrome 支持；iOS Safari 不支持，
     此时提示用户手动横过手机） */
  lockLandscape();

  /* 多次重算：真机地址栏收缩 / 旋转 / PWA 视口变化都是异步的 */
  const fix=()=>{ try{ if(chart){ chart.resize(); } }catch(e){} };
  requestAnimationFrame(fix);
  [80,200,400,700,1200,2000].forEach(t=>setTimeout(fix,t));
}

/* ── 横屏：优先方向锁，失败则 CSS 旋转（iOS 走这条）── */
let orientationLocked=false, cssRotated=false;

function lockLandscape(){
  const card=document.getElementById('chartCard');
  // 已经物理横屏了就不折腾
  if(window.innerWidth > window.innerHeight){ return; }
  try{
    if(screen.orientation && screen.orientation.lock){
      screen.orientation.lock('landscape')
        .then(()=>{ orientationLocked=true; })
        .catch(()=>{ applyCssRotate(); });     // 锁定被拒（iOS/权限）
    }else{
      applyCssRotate();                        // 无该 API（iOS Safari/PWA）
    }
  }catch(e){ applyCssRotate(); }
}

/* 纯 CSS 旋转：把卡片转 90°，视觉上变成横屏 */
function applyCssRotate(){
  if(window.innerWidth > window.innerHeight) return;   // 已横屏则无需旋转
  const card=document.getElementById('chartCard');
  if(!card) return;
  setRotateSize(card);
  card.classList.add('rot');
  cssRotated=true;
  const hint=document.getElementById('rotateHint');
  if(hint) hint.classList.remove('show');              // 已用旋转解决，不必提示
  [60,200,500,1000].forEach(t=>setTimeout(()=>{ try{ if(chart) chart.resize(); }catch(e){} }, t));
}

/* 写入旋转后的尺寸变量（宽=视口高，高=视口宽） */
function setRotateSize(card){
  const w=window.innerHeight, h=window.innerWidth;
  card.style.setProperty('--fl-w', w+'px');
  card.style.setProperty('--fl-h', h+'px');
}

function exitFull(){
  if(!isFull) return;
  const card=document.getElementById('chartCard');
  card.classList.remove('fs');
  document.body.classList.remove('fs-open');
  isFull=false;
  const btn=document.getElementById('btnFull');
  if(btn) btn.textContent='⛶ 全屏';
  try{ if(orientationLocked && screen.orientation && screen.orientation.unlock) screen.orientation.unlock(); }catch(e){}
  orientationLocked=false;
  card.classList.remove('rot');                 // 清除 CSS 旋转
  card.style.removeProperty('--fl-w');
  card.style.removeProperty('--fl-h');
  cssRotated=false;
  const hint=document.getElementById('rotateHint');
  if(hint) hint.classList.remove('show');
  const fix=()=>{ try{ if(chart) chart.resize(); }catch(e){} };
  requestAnimationFrame(fix);
  [80,200,400].forEach(t=>setTimeout(fix,t));
}

/* ESC 退出 */
document.addEventListener('keydown', e=>{
  if(e.key==='Escape' && isFull) exitFull();
});
/* 手机旋转 / 视口变化时重算尺寸（真机必需） */
function refit(){ try{ if(chart) chart.resize(); }catch(e){} }
window.addEventListener('orientationchange', ()=>{
  [100,400,900].forEach(t=>setTimeout(refit,t));
  setTimeout(()=>{
    const hint=document.getElementById('rotateHint');
    const card=document.getElementById('chartCard');
    if(window.innerWidth>window.innerHeight){
      // 设备已物理横屏 → 去掉 CSS 旋转，避免「转两次」
      if(card && cssRotated){ card.classList.remove('rot'); cssRotated=false; }
      if(hint) hint.classList.remove('show');
      refit();
    } else if(isFull && card && !cssRotated && !orientationLocked){
      // 又转回竖屏 → 重新应用 CSS 旋转
      applyCssRotate();
    }
  }, 500);
});

/* ══════════ 关键数据条带（走势图下方，五类上下排列）══════════
   分类依据：抖音图文《纳指与红利低波指标对比》2026-10-14
     - 作品#2「红利低波六信号」把 RSI(14)、KDJ(K/D/J) 归入「强弱(STRENGTH)」面板，
       量比归入「位置+量能(POSITION)」，250日均线乖离（=r250 的原始表达）归「位置」
     - 作品#1「纳指/标普温度」把 VIX/VXN/CNN 归入「情绪」，并强调方向相反
   五类归并：趋势 / 动量 / 波动率 / 成交量 / 情绪（上下各占一行） */
function renderKeyBar(){
  const box=document.getElementById('keyBar');
  if(!box) return;
  const i=D.indicators;
  const L=arr=>{ const a=arr||[]; for(let k=a.length-1;k>=0;k--) if(a[k]!==null&&a[k]!==undefined) return a[k]; return null; };

  const r250=L(i.r250), r500=L(i.r500), rsi=L(i.rsi14);
  const kk=L(i.kdj_k), kd=L(i.kdj_d);
  const vr=L(i.volratio);
  let vxn=null; try{ vxn=last(D.vxn.rows)[1]; }catch(e){}
  let cnn=null; try{ cnn=D.cnn.current.score; }catch(e){}

  /* 状态判定（区间取自抖音原文） */
  const stRSI = rsi==null?['','st-mid'] : rsi<30?['超卖','st-cold'] : rsi>70?['超买','st-hot'] : ['中性','st-mid'];
  /* ⚠️ 状态文字里的 < > 必须转义，否则被当成 HTML 标签吞掉内容 */
  const stKD  = kd==null?['','st-mid'] : kk>kd?['K&gt;D 多头','st-hot'] : kk<kd?['K&lt;D 空头','st-cold'] : ['交叉','st-mid'];
  const stR250= r250==null?['','st-mid'] : r250>=1?['价在年线上','st-hot'] : ['价在年线下','st-cold'];
  const stR500= r500==null?['','st-mid'] : r500>=1?['价在两年线上','st-hot'] : ['价在两年线下','st-cold'];
  const stVR  = vr==null?['','st-mid'] : vr>1.5?['放量','st-hot'] : vr<0.7?['缩量','st-cold'] : ['正常','st-mid'];
  const stVXN = vxn==null?['','st-mid'] : vxn>25?['紧张','st-warn'] : vxn>40?['恐慌','st-hot'] : vxn<18?['平静','st-cold'] : ['中性','st-mid'];
  /* ⚠️ CNN 方向相反：越低越恐慌 */
  const stCNN = cnn==null?['','st-mid'] : cnn<25?['极度恐慌','st-hot'] : cnn>75?['极度贪婪','st-warn'] : ['中性','st-mid'];

  const row=(cls,tag,items)=>'<div class="krow">'+
    '<span class="ktag '+cls+'">'+tag+'</span>'+
    '<span class="kitems">'+items.map(it=>{
      // it[1]==='' 表示该指标只有状态、无数值（如 KDJ 交叉判定）
      const val = (it[1]===''||it[1]==null) ? '' : '<span class="kv '+((it[1]==null)?'none':'')+'">'+it[1]+'</span>';
      return '<span class="ki"><span class="kn">'+it[0]+'</span>'+ val +
        (it[2]&&it[2][0]?'<span class="kst '+it[2][1]+'">'+it[2][0]+'</span>':'')+
        '</span>';
    }).join('')+
    '</span></div>';

  box.innerHTML =
    row('kt-trend','趋势',[
      ['r250', r250==null?'—':r250.toFixed(3), stR250],
      ['r500', r500==null?'—':r500.toFixed(3), stR500],
    ])+
    row('kt-mom','动量',[
      ['RSI(14)', rsi==null?'—':rsi.toFixed(1), stRSI],
      ['K', kk==null?'—':kk.toFixed(1), null],
      ['D', kd==null?'—':kd.toFixed(1), null],
      ['KDJ', '', stKD],
    ])+
    row('kt-vola','波动率',[
      ['VXN', vxn==null?'—':vxn.toFixed(2), stVXN],
    ])+
    row('kt-volume','成交量',[
      ['量比', vr==null?'—':vr.toFixed(2), stVR],
    ])+
    row('kt-senti','情绪',[
      ['CNN', cnn==null?'—':cnn.toFixed(1), stCNN],
    ]);
}

function renderSrcBox(){
  const i=D.indicators;
  /* 量比/KDJ 的可用起点：指标数组里第一个非空位置
     （布林带宽只需收盘价，覆盖全区间，不走这个变量） */
  let volStart='—';
  for(const key of ['volratio','kdj_j']){
    const arr=i[key]||[];
    const idx=arr.findIndex(v=>v!==null && v!==undefined);
    if(idx>=0 && i.dates[idx]){ volStart=i.dates[idx]; break; }
  }
  /* 成交量本身的起点与条数（勿写死，随数据增长） */
  const _volArr=i.volume||[];
  const _vIdx=_volArr.findIndex(v=>v!==null && v!==undefined);
  const volFrom=(_vIdx>=0 && i.dates[_vIdx]) ? i.dates[_vIdx] : '—';
  const volCount=_volArr.filter(v=>v!==null && v!==undefined).length;
  document.getElementById('srcBox').innerHTML=
    '<b>数据来源与口径</b><br>'+
    '行情/技术：FRED NASDAQ100（'+i.start+' ~ '+i.end+'，'+i.dates.length+' 个交易日）｜本地自算 MA200 / MA250 / MA500 / r500 / r250 / RSI(14) / 回撤<br>'+
    '量能·KDJ·布林：成交量来自<b>新浪美股 .NDX</b>（'+volFrom+' 起，'+volCount+' 个交易日）｜本地自算 <b>量比、KDJ(9,3,3)、布林带宽(20日±2σ)</b>（'+volStart+' 起）<br>'+
    '情绪：VXN FRED VXNCLS（2001-02-02 起）｜VIX CBOE（1990-01-02 起）｜CNN Fear&Greed（2020-07-17 起）<br>'+
    '估值：蛋卷 danjuanfunds（2016-10-12 起，周频 514 点）｜股息率 nikkei225jp（2019-06-06 起）｜权重 SEC N-PORT（'+D.weights.asOf+'，季度）<br>'+
    '回撤口径：<b>峰→谷单段</b>，A ≥15% / B 10–15% / C 5–10%，D(&lt;5%)不画｜已算出 A '+i.segCounts.A+' 段、B '+i.segCounts.B+' 段、C '+i.segCounts.C+' 段'+
    '<div class="warnbox"><b>⚠️ 五类必须知道的口径限制</b><br>'+
    '1. <b>禁止跨口径比大小</b>：NDX 的 PE 三家不同源 —— 蛋卷 '+fmt(D.danjuan_now.pe)+'（'+D.danjuan_now.date+'）／Siblis 35.24（2026-06-30）／Nasdaq 官方 35.23（2026-06-30）。<br>'+
    '2. <b>估值序列起点 2016-10</b>，覆盖不到 2002（图上留白并已标注）。<br>'+
    '3. <b>波动率两口径不可比</b>：VXN/VIX 是「隐含波动」（期权预期），年化波动率是「已实现波动」（历史）。<br>'+
    '4. <b>QDII 净值天然滞后 1 日</b>（本页为指数口径，不受影响）。<br>'+
    '5. <b>量比/KDJ 覆盖不到 2002-2014</b>：这两项需要 OHLCV（开高低收+成交量），而 FRED 只提供收盘价；<br>'+
    '　　&nbsp;&nbsp;成交量自 <b>2014-02-18</b> 才有（新浪源），此前区间在图上留白。<br>'+
    '　　&nbsp;&nbsp;布林带宽只用收盘价，<b>覆盖 2002 起全区间</b>，不受此限。'+
    '<div style="margin-top:8px;padding-top:8px;border-top:1px dashed #e5e7eb">'+
    '<b>📐 三项新指标的计算式</b><br>'+
    '<b>量比</b> = 当日成交量 ÷ 过去 5 个交易日平均量（<u>不含当日</u>）｜&gt;1.5 明显放量、0.7~1.5 正常、&lt;0.7 缩量<br>'+
    '<b>KDJ(9,3,3)</b>：RSV =(收盘−9日最低)÷(9日最高−9日最低)×100｜K = ⅔·K<sub>前</sub> + ⅓·RSV｜D = ⅔·D<sub>前</sub> + ⅓·K｜J = 3K − 2D<br>'+
    '　　&nbsp;&nbsp;K 上穿 D = 金叉，下穿 = 死叉；J&gt;100 超买、J&lt;0 超卖<br>'+
    '<b>布林带宽</b> =(上轨−下轨)÷中轨×100%，上/下轨 = 20日均价 ± 2×标准差｜收窄=波动收敛（常预示变盘）、扩张=波动放大'+
    '</div></div>';
}

/* ========== 启动 ========== */
(function init(){
  document.getElementById('genAt').textContent='页面生成于 '+(D.generatedAt||'');
  selected=loadSel();                        // Q3.c：恢复上次选择
  renderIndexList(); renderKeyBar(); renderSrcBox();
  window.addEventListener('resize',()=>{ if(chart) chart.resize(); });

  /* ── 渲染失败自愈 ──
     场景：手机上 Service Worker 缓存了旧版 JS，与新版数据/结构不兼容，
           导致指数列表渲染为空、页面看似「打不开」。
     处理：2 秒后检查是否真的渲染出卡片；若为空 → 注销 SW + 清缓存 + 强刷。
     防循环：用 sessionStorage 记一次，同一会话只自愈一次。 */
  setTimeout(()=>{
    try{
      const n=document.querySelectorAll('#idxGrid .idxcard').length;
      if(n>0) return;                        // 渲染正常，无需处理
      if(sessionStorage.getItem('wb_healed')) return;   // 已自愈过，避免死循环
      sessionStorage.setItem('wb_healed','1');
      const clean=()=>{
        if('serviceWorker' in navigator && navigator.serviceWorker.getRegistrations){
          navigator.serviceWorker.getRegistrations().then(rs=>{
            rs.forEach(r=>r.unregister());
          }).catch(()=>{});
        }
        if(window.caches && caches.keys){
          caches.keys().then(ks=>ks.forEach(k=>caches.delete(k))).catch(()=>{});
        }
      };
      clean();
      // 加时间戳强刷，绕过所有 HTTP 缓存
      const u=new URL(location.href);
      u.searchParams.set('_r', Date.now());
      setTimeout(()=>{ location.replace(u.toString()); }, 250);
    }catch(e){}
  }, 2000);
})();

/* PWA：注册 Service Worker（离线可看 + 主屏图标）。
   ⚠️ 仅 http(s) 下注册——本地 file:// 打开时跳过，不影响本地使用。 */
if('serviceWorker' in navigator && location.protocol.startsWith('http')){
  window.addEventListener('load',()=>{
    navigator.serviceWorker.register('sw.js').then(reg=>{
      reg.update().catch(()=>{});          // 主动检查新版本，避免长期用旧缓存
      // 新 SW 就绪且页面已受控时，刷新一次以拿到新版
      reg.addEventListener('updatefound', ()=>{
        const nw=reg.installing;
        if(!nw) return;
        nw.addEventListener('statechange', ()=>{
          if(nw.state==='installed' && navigator.serviceWorker.controller){
            // 静默刷新一次（带标记防循环）
            if(!sessionStorage.getItem('sw_reloaded')){
              sessionStorage.setItem('sw_reloaded','1');
              location.reload();
            }
          }
        });
      });
    }).catch(()=>{ /* 静默失败，不影响页面 */ });
  });
}

/* 空白自愈：全屏后若图表区域高度异常（真机兼容问题），自动降级回普通模式 */
setTimeout(()=>{
  if(!isFull) return;
  try{

    const h=el? el.getBoundingClientRect().height : 0;
    if(!el || h < 120){                   // 低于 120px 视为异常
      console.warn('[全屏] 检测到图表高度异常('+h+'px)，自动退出全屏');
      exitFull();
    }
  }catch(e){}
}, 1500);
